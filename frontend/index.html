      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --stage-bg: #0c0c0c;
      --stage-fg: #f2f2f2;
    }
    [data-theme="light"] {
      --bg: #f0efed;
      --panel: #fafaf9;
      --panel-alt: #e8e6e3;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #1a1a1a;
      --accent: #1a8a7c;
      --accent-ink: #ffffff;
      --stage-bg: #f0efed;
      --stage-fg: #1a1a1a;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html {
      height: 100%;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
    }
    body {
      margin: 0;
      height: 100%;
      font-family: var(--font);
      color: var(--stage-fg);
      background: var(--stage-bg);

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }

    /* floating chrome — logo pinned top-left */
    .brand {
      position: fixed;
      z-index: 55;
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--stage-fg); text-decoration: none; font-weight: 700;
      background: var(--stage-bg); border: var(--frame) solid var(--border);
      padding: 6px 10px 6px 6px;
      top: 18px; left: 18px;

    }
    .monogram {
      width: 34px; height: 34px; display: grid; place-items: center;
      background: var(--accent); color: var(--accent-ink);
      font-family: var(--mono); font-size: 12px; font-weight: 700;
    }
    .site-header {
      position: fixed; top: 18px; right: 18px; z-index: 50;
      display: flex; align-items: center; pointer-events: none;
    }
    .site-header > * { pointer-events: auto; }
    .nav-actions { display: flex; gap: 0; align-items: center; border: var(--frame) solid var(--border); }
    .icon-btn, .hud-btn {
      appearance: none; border: 0; border-right: var(--frame) solid var(--border);
      background: var(--stage-bg); color: var(--stage-fg); min-height: 42px;
      padding: 0 12px; font-family: var(--mono); font-size: 11px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: background-color .55s var(--ease), color .55s var(--ease), border-color .55s var(--ease);
    }
    .nav-actions .icon-btn:last-child { border-right: 0; }
    .icon-btn:hover, .hud-btn:hover { background: var(--accent); color: var(--accent-ink); }

    .hud-dots {
      position: fixed; right: 18px; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 11px; z-index: 40;
      color: var(--stage-fg);
      transition: color .55s var(--ease);
    }
    .hud-dots button {
      width: 11px; height: 11px; padding: 0; border: 2px solid currentColor;
      background: transparent; color: inherit; cursor: pointer;
      transition: transform .2s var(--ease), background .2s var(--ease);
    }
    .hud-dots button.is-active { background: currentColor; transform: scale(1.2); }
    .hud-counter {
      position: fixed; left: 18px; bottom: 18px; z-index: 40;
      font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em;
      border: var(--frame) solid var(--border); background: var(--stage-bg); color: var(--stage-fg);
      padding: 10px 12px; font-weight: 600;
      transition: background-color .55s var(--ease), color .55s var(--ease), border-color .55s var(--ease);
    }
    .hud-controls {
      position: fixed; right: 18px; bottom: 18px; z-index: 40;
      display: flex; flex-direction: column; gap: 0;
      border: var(--frame) solid var(--border);
      transition: border-color .55s var(--ease);
    }
    .hud-btn {
      min-width: 92px; justify-content: center; background: var(--stage-bg); color: var(--stage-fg);
      border-right: 0 !important;
    }
    .hud-btn#spiral-next {
      flex-direction: column; gap: 4px; min-height: 88px; font-size: 11px;
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .hud-btn#spiral-next .phi {
      width: 22px; height: 22px; border: 2px solid currentColor; border-radius: 50%;
      position: relative;
    }
    .hud-btn#spiral-next .phi::before,
    .hud-btn#spiral-next .phi::after {
      content: ""; position: absolute; background: currentColor;
    }
    .hud-btn#spiral-next .phi::before {
      width: 2px; height: 10px; left: 8px; top: 4px;
    }
    .hud-btn#spiral-next .phi::after {
      width: 8px; height: 2px; left: 8px; top: 8px;
    }
    body.is-accessible .hud-dots,
    body.is-accessible .hud-counter,
    body.is-accessible .hud-controls { display: none; }
    body.is-accessible .brand {
      position: static; transition: none;
    }
    body.is-accessible .site-header {
      position: sticky; top: 0; inset: auto; right: auto;
      width: 100%; height: 52px; margin: 0; padding: 0 14px;
      background: var(--stage-bg); border-bottom: var(--frame) solid var(--border);
      pointer-events: auto; justify-content: space-between;
    }

    /* spiral stage */
    .stage {
      position: fixed; inset: 0;
      overflow: hidden; background: var(--stage-bg);
      transition: background-color .55s var(--ease);
    }
    .spiral {
      position: absolute; inset: 0;
      transform-origin: 0 0;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      will-change: transform;
      contain: layout style;
    }
    .spiral-section {
      position: absolute; left: 0; top: 0;
      border: var(--frame) solid var(--border);
      background: var(--panel);
      color: var(--text);
      /* border-radius forces Chrome to clip overflow under CSS transforms */

      border-radius: 0.01px;
      cursor: pointer;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
      contain: layout paint;
      transition: background-color .55s var(--ease), color .55s var(--ease), border-color .55s var(--ease), opacity .35s var(--ease);
    }
    .spiral-section.active {
      cursor: default;
      z-index: 3;
    }
    /* keep far panels painted but inert — no visibility pop after flip */
    .spiral-section.is-far {
      opacity: 0;
      pointer-events: none;
    }
    body.is-spinning .spiral-section.is-far {
      opacity: 1;
    }
    .spiral-section .panel-scroll {
      height: 100%;
      overflow: hidden;
      padding: clamp(18px, 2.6vw, 36px);
      padding-top: 76px; /* permanent clearance for pinned logo */
      padding-bottom: 96px; /* clearance for counter / next */
      overscroll-behavior: contain;
      pointer-events: none;
      scrollbar-width: thin;
      border-radius: 0.01px;
      transform: translate3d(0, 0, 0);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }
    /* enable inner scroll only on settled active panel — avoids Chrome transform+overflow blanking */
    body:not(.is-spinning) .spiral-section.active .panel-scroll {
      overflow: auto;
      pointer-events: auto;

    /* accessible fallback = normal page */
    body.is-accessible .stage {
      position: static; overflow: visible; inset: auto;
      padding-top: 0;
    }
    body.is-accessible .spiral {
      position: static; transform: none !important;
      display: flex; flex-direction: column; gap: 0;
    }
    body.is-accessible .spiral-section {
      position: static !important;
      width: auto !important; height: auto !important;
      transform: none !important;
      min-height: 70vh;
      cursor: default;
      border-left: 0; border-right: 0;

      pointer-events: auto; overflow: visible; max-width: 1100px; margin: 0 auto;

    /* inner content */

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .btn {
      appearance: none; display: inline-flex; align-items: center; justify-content: center;
      min-height: 42px; padding: 0 14px; border: var(--frame) solid currentColor;
      font-family: var(--font); font-size: 14px; font-weight: 700;

    .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      "use strict";

      const STORAGE_LANG = "valeru-lang";
      const STORAGE_THEME = "valeru-theme";
      const STORAGE_MODE = "valeru-mode";
      const ASPECT = 0.618033;
      const AXIS = 0.7237;

      const spiralEl = document.getElementById("spiral");
      const sections = Array.from(document.querySelectorAll(".spiral-section"));
      const sectionCount = sections.length;

      let lang, theme, accessible;
      let rotation = 0;
      let moved = 0;
      let prevMoved = 0;
      let currentSection = 0;
      let animRAF = null;
      let spinning = false;
      let targetSection = 0;
      let paintedSection = -1;
      let farTimer = null;
      let wheelAcc = 0;
      let wheelAccTimer = null;
      let wheelLockedUntil = 0;
      const WHEEL_THRESHOLD = 40;
      const WHEEL_ACC_DECAY_MS = 240;
      const WHEEL_STEP_LOCK_MS = 480;
      let touchStartX = 0;
      let touchStartY = 0;
      let winW = window.innerWidth;
      let winH = window.innerHeight;
      let smallScreen = winW < 960;
      let landscape = winH < winW;

      // Per-section palettes: bg/panel/fg/accent always designed as a matching set
      // Order: hero, about, stack, experience, projects, education, reviews, apply, contacts
      const SECTION_PALETTE_DARK = [
        { bg: "#121516", fg: "#eef3f1", panel: "#181c1d", accent: "#5bb8a8", accentInk: "#062824", border: "#dfe8e5", muted: "#93a09c" },
        { bg: "#f2ebe3", fg: "#1c1814", panel: "#faf6f1", accent: "#c47a4a", accentInk: "#fff7f0", border: "#1c1814", muted: "#6f655c" },
        { bg: "#4f8f7a", fg: "#071f18", panel: "#4f8f7a", accent: "#dff5ec", accentInk: "#071f18", border: "#0d2a22", muted: "#1f3d33" },
        { bg: "#141820", fg: "#eef1f6", panel: "#1a1f2a", accent: "#7aa2ff", accentInk: "#0b1220", border: "#d5dceb", muted: "#97a3b6" },
        { bg: "#f5e9e5", fg: "#271c1a", panel: "#fbf3f0", accent: "#d06b6b", accentInk: "#fff5f4", border: "#271c1a", muted: "#7a5f5b" },
        { bg: "#5c6b9a", fg: "#0e1428", panel: "#5c6b9a", accent: "#e6eaf8", accentInk: "#0e1428", border: "#121830", muted: "#1d2540" },
        { bg: "#171814", fg: "#f2f1ea", panel: "#1e1f1a", accent: "#c4b46a", accentInk: "#1a180c", border: "#ece9dc", muted: "#a3a090" },
        { bg: "#e7eef3", fg: "#152029", panel: "#f3f7fa", accent: "#3d7ea6", accentInk: "#f4f9fc", border: "#152029", muted: "#5c6b76" },
        { bg: "#c9a07a", fg: "#1f130c", panel: "#c9a07a", accent: "#fff6ec", accentInk: "#1f130c", border: "#24160e", muted: "#3a2418" }
      ];
      const SECTION_PALETTE_LIGHT = [
        { bg: "#f0efec", fg: "#1a1a1a", panel: "#fafaf8", accent: "#1a8a7c", accentInk: "#ffffff", border: "#1a1a1a", muted: "#66706d" },
        { bg: "#1c1916", fg: "#f4efe8", panel: "#26211c", accent: "#e0a078", accentInk: "#1c140e", border: "#f0e8df", muted: "#b0a498" },
        { bg: "#2f6f5f", fg: "#f3fbf8", panel: "#2f6f5f", accent: "#b8e6d6", accentInk: "#0d2a22", border: "#0f2a22", muted: "#d5ebe3" },
        { bg: "#f7f8fb", fg: "#151922", panel: "#ffffff", accent: "#3f6fd6", accentInk: "#ffffff", border: "#151922", muted: "#5f6b7d" },
        { bg: "#2a1f1e", fg: "#f8eeea", panel: "#352826", accent: "#e08a8a", accentInk: "#2a1414", border: "#f0ddd8", muted: "#b89b96" },
        { bg: "#e8ebf5", fg: "#161b2c", panel: "#f4f6fb", accent: "#4a5f9a", accentInk: "#ffffff", border: "#161b2c", muted: "#5c6680" },
        { bg: "#1a1b16", fg: "#f2f1ea", panel: "#24251f", accent: "#d2c37a", accentInk: "#1a180c", border: "#ece9dc", muted: "#a8a592" },
        { bg: "#f4f8fb", fg: "#152029", panel: "#ffffff", accent: "#3d7ea6", accentInk: "#ffffff", border: "#152029", muted: "#5c6b76" },
        { bg: "#a86b3e", fg: "#fff8f1", panel: "#a86b3e", accent: "#ffe7d2", accentInk: "#2a160c", border: "#2a160c", muted: "#f0d8c4" }
      ];

      function safeGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
      function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
      function t(obj, l) {
        if (obj == null) return "";
        if (typeof obj === "string") return obj;
        return obj[l] != null ? obj[l] : (obj.ru || obj.en || "");
      }
      function detectLang() {
        const s = safeGet(STORAGE_LANG);
        if (s === "ru" || s === "en") return s;
        return (navigator.language || "ru").toLowerCase().startsWith("ru") ? "ru" : "en";
      }
      function detectTheme() {
        const s = safeGet(STORAGE_THEME);
        if (s === "dark" || s === "light") return s;
        return window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      function detectMode() {
        return safeGet(STORAGE_MODE) === "accessible";
      }
      function reduceMotion() {
        return window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      }

      lang = detectLang();
      theme = detectTheme();
      accessible = detectMode() || reduceMotion();

      function apiUrl(path) {
        return String(CONTENT.apiBase || "").replace(/\/$/, "") + path;
      }
      function hhLink() {
        const link = CONTENT.contacts.links.find((l) => l.id === "hh");
        return link ? link.href : "https://hh.ru";
      }
      function emailValue() {
        const link = CONTENT.contacts.links.find((l) => l.id === "email");
        return link ? link.value : "";
      }

      function trimRotation(r) {
        // keep spiral within real sections — overshoot caused blank/broken panels
        const min = -(sectionCount - 1) * 90;
        return Math.max(min, Math.min(0, r));
      }

      function setSpinning(on) {
        spinning = !!on;
        document.body.classList.toggle("is-spinning", spinning);
      }

      function palette() {
        return theme === "light" ? SECTION_PALETTE_LIGHT : SECTION_PALETTE_DARK;
      }

      function applySectionColors(index, force) {
        const safeIndex = Math.min(Math.max(index || 0, 0), palette().length - 1);
        if (!force && safeIndex === paintedSection) return;
        paintedSection = safeIndex;
        const p = palette()[safeIndex];
        const root = document.documentElement;
        root.style.setProperty("--stage-bg", p.bg);
        root.style.setProperty("--stage-fg", p.fg);
        root.style.setProperty("--bg", p.bg);
        root.style.setProperty("--text", p.fg);
        root.style.setProperty("--panel", p.panel);
        root.style.setProperty("--panel-alt", p.panel);
        root.style.setProperty("--border", p.border);
        root.style.setProperty("--accent", p.accent);
        root.style.setProperty("--accent-ink", p.accentInk);
        root.style.setProperty("--muted", p.muted);
        document.body.style.backgroundColor = p.bg;
        document.body.style.color = p.fg;
        document.body.setAttribute("data-section", sections[safeIndex] ? sections[safeIndex].id : "");
        const stage = document.getElementById("stage");
        if (stage) stage.style.backgroundColor = p.bg;
        sections.forEach((s, i) => {
          const sp = palette()[Math.min(i, palette().length - 1)];
          s.style.backgroundColor = sp.panel;
          s.style.color = sp.fg;
          s.style.borderColor = sp.border;
        });
        const brand = document.getElementById("brand-link");
        if (brand) {
          brand.style.backgroundColor = p.bg;
          brand.style.color = p.fg;
          brand.style.borderColor = p.border;
        }
      }

      function settleActivePanel() {
        sections.forEach((s, i) => {
          const box = s.querySelector(".panel-scroll");
          if (!box) return;
          if (i !== currentSection) box.scrollTop = 0;
        });
      }

      function applyTheme() {
        document.documentElement.setAttribute("data-theme", theme);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f0efed" : "#0c0c0c");
        document.getElementById("theme-icon").textContent = theme === "light" ? "☾" : "☀";
        const label = theme === "light" ? t(CONTENT.nav.themeDark, lang) : t(CONTENT.nav.themeLight, lang);
        document.getElementById("theme-toggle").setAttribute("aria-label", label);
        document.getElementById("theme-toggle").title = label;
        applySectionColors(currentSection || 0, true);
      }

      function applyMode() {
        document.body.classList.toggle("is-accessible", accessible);
        const modeBtn = document.getElementById("mode-toggle");
        const brand = document.getElementById("brand-link");
        const header = document.getElementById("site-header");
        modeBtn.textContent = accessible
          ? t((CONTENT.spiral && CONTENT.spiral.accessibleOff) || { ru: "Спираль", en: "Spiral" }, lang)
          : t((CONTENT.spiral && CONTENT.spiral.accessibleOn) || { ru: "Обычный скролл", en: "Normal scroll" }, lang);
        if (accessible) {
          spiralEl.style.transform = "";
          sections.forEach((s) => {
            s.style.transform = "";
            s.style.width = "";
            s.style.height = "";
            s.classList.remove("is-far");
          });
          brand.style.top = "";
          brand.style.left = "";
          if (brand.parentElement !== header) header.insertBefore(brand, header.firstChild);
        } else {
          if (brand.parentElement === header) document.body.insertBefore(brand, header);
          pinBrand();
          buildSpiral();
          scrollHandler();
        }
      }

      function pinBrand() {
        const brand = document.getElementById("brand-link");
        if (!brand || accessible) return;
        brand.style.top = "18px";
        brand.style.left = "18px";
        document.body.removeAttribute("data-brand");
      }

      function buildSpiral() {
        if (accessible) return;
        winW = window.innerWidth;
        winH = window.innerHeight;
        smallScreen = winW < 960;
        landscape = winH < winW;

        let originX, originY, w, h;
        if (smallScreen && !landscape) {
          originX = Math.floor((winW / ASPECT) * ASPECT * (1 - AXIS));
          originY = Math.floor((winW / ASPECT) * AXIS);
          w = winW;
          h = winW;
        } else {
          originX = Math.floor(winW * AXIS);
          originY = Math.floor(winW * ASPECT * AXIS);
          w = winW * ASPECT;
          h = winW * ASPECT;
        }
        const origin = originX + "px " + originY + "px";
        spiralEl.style.transformOrigin = origin;

        sections.forEach((section, i) => {
          const myRot = 90 * i;
          const scale = Math.pow(ASPECT, i);
          section.style.width = w + "px";
          section.style.height = h + "px";
          section.style.transformOrigin = origin;
          section.style.transform = "rotate(" + myRot + "deg) scale(" + scale + ") translate3d(0,0,0)";
        });
      }

      function sectionIndexFromRotation(r) {
        return Math.min(sectionCount - 1, Math.max(0, Math.round(-r / 90)));
      }

      // GSAP-driven spiral — section steps only (no per-tick scrub)
      const spiralState = { r: 0 };
      const hasGsap = typeof gsap !== "undefined";
      let snapTween = null;
      if (hasGsap) {
        gsap.ticker.lagSmoothing(500, 33);
      }

      function paintSpiralTransform() {
        const r = spiralState.r;
        const scale = Math.pow(ASPECT, r / 90);
        spiralEl.style.transform = "rotate(" + r + "deg) scale(" + scale + ") translate3d(0,0,0)";
        rotation = r;
      }

      function updateHudOnly(index) {
        const idx = index != null ? index : sectionIndexFromRotation(spiralState.r);
        const cur = String(idx + 1).padStart(2, "0");
        const tot = String(sectionCount).padStart(2, "0");
        document.getElementById("hud-current").textContent = cur;
        document.getElementById("hud-total").textContent = tot;
        document.querySelectorAll("#hud-dots button").forEach((b, i) => {
          b.classList.toggle("is-active", i === idx);
        });
      }

      function markActiveSection(index) {
        sections.forEach((s, i) => {
          s.classList.toggle("active", i === index);
          s.classList.remove("is-far");
        });
      }

      function applyFarSections() {
        clearTimeout(farTimer);
        farTimer = setTimeout(() => {
          if (spinning) return;
          sections.forEach((s, i) => {
            // keep a wide painted window so next/prev already look final
            const far = i - currentSection < -2 || i - currentSection > 3;
            s.classList.toggle("is-far", far);
          });
        }, 200);
      }

      function scrollHandler() {
        if (accessible) return;
        paintSpiralTransform();
        updateHudOnly(currentSection);
        if (!spinning) {
          markActiveSection(currentSection);
          applySectionColors(currentSection);
          pinBrand();
          applyFarSections();
        }
      }

      function finishScroll(targR) {
        const target = trimRotation(Math.round(targR / 90) * 90);
        spiralState.r = target;
        rotation = target;
        paintSpiralTransform();
        currentSection = sectionIndexFromRotation(target);
        targetSection = currentSection;
        markActiveSection(currentSection);
        updateHudOnly(currentSection);
        // colors already tweening from animateScroll start — reinforce final palette
        applySectionColors(currentSection, true);
        pinBrand();
        setSpinning(false);
        clearTimeout(settleActivePanel._t);
        settleActivePanel._t = setTimeout(settleActivePanel, 40);
        applyFarSections();
        cancelAnimationFrame(animRAF);
        animRAF = null;
        wheelLockedUntil = 0;
      }

      function killSpiralMotion() {
        if (snapTween) {
          snapTween.kill();
          snapTween = null;
        }
        if (hasGsap) gsap.killTweensOf(spiralState);
        cancelAnimationFrame(animRAF);
        animRAF = null;
      }

      function animateScroll(targR, duration) {
        if (accessible) return;
        const target = trimRotation(Math.round(targR / 90) * 90);
        const destIndex = sectionIndexFromRotation(target);
        const alreadyThere = Math.abs(target - spiralState.r) < 0.05;
        if (alreadyThere && !spinning) {
          finishScroll(target);
          return;
        }

        killSpiralMotion();
        setSpinning(true);
        // reveal neighbors + start palette morph during the flip (not after)
        sections.forEach((s) => s.classList.remove("is-far"));
        applySectionColors(destIndex, true);
        updateHudOnly(destIndex);
        pinBrand();

        if (!hasGsap || reduceMotion()) {
          spiralState.r = target;
          finishScroll(target);
          return;
        }

        const dist = Math.abs(target - spiralState.r);
        const dur = duration != null
          ? duration
          : Math.min(0.62, Math.max(0.42, 0.36 + dist / 280));

        snapTween = gsap.to(spiralState, {
          r: target,
          duration: dur,
          ease: "power3.out",
          overwrite: true,
          onUpdate: paintSpiralTransform,
          onComplete: function () {
            snapTween = null;
            finishScroll(target);
          }
        });
      }

      function goTo(index) {
        const i = Math.min(sectionCount - 1, Math.max(0, index));
        targetSection = i;
        if (accessible) {
          sections[i].scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
          currentSection = i;
          applySectionColors(i, true);
          return;
        }
        animateScroll(i * -90);
      }

      function normalizeWheelDelta(e) {
        let dy = e.deltaY;
        if (e.deltaMode === 1) dy *= 16;
        else if (e.deltaMode === 2) dy *= winH;
        return dy;
      }

      function onWheel(e) {
        if (accessible) return;
        const active = sections[spinning ? targetSection : currentSection];
        const scrollBox = active && active.querySelector(".panel-scroll");
        if (scrollBox && scrollBox.contains(e.target) && !spinning) {
          const canScroll = scrollBox.scrollHeight > scrollBox.clientHeight + 2;
          if (canScroll) {
            const goingDown = e.deltaY > 0;
            const goingUp = e.deltaY < 0;
            const atTop = scrollBox.scrollTop <= 0;
            const atBottom = scrollBox.scrollTop + scrollBox.clientHeight >= scrollBox.scrollHeight - 1;
            if ((goingDown && !atBottom) || (goingUp && !atTop)) return;
          }
        }
        e.preventDefault();

        const now = performance.now();
        const dy = normalizeWheelDelta(e);
        if (now < wheelLockedUntil) return;

        wheelAcc += dy;
        clearTimeout(wheelAccTimer);
        wheelAccTimer = setTimeout(() => { wheelAcc = 0; }, WHEEL_ACC_DECAY_MS);

        if (Math.abs(wheelAcc) < WHEEL_THRESHOLD) return;

        const dir = wheelAcc > 0 ? 1 : -1;
        wheelAcc = 0;
        wheelLockedUntil = now + WHEEL_STEP_LOCK_MS;

        const next = Math.min(sectionCount - 1, Math.max(0, targetSection + dir));
        if (next === targetSection) return;
        goTo(next);
      }

      function onKey(e) {
        if (accessible) return;
        const tag = (e.target && e.target.tagName) || "";
        if (/INPUT|TEXTAREA|SELECT/.test(tag)) return;
        if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " " || e.key === "PageDown") {
          e.preventDefault();
          goTo(targetSection + 1);
        } else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") {
          e.preventDefault();
          goTo(targetSection - 1);
        }
      }

      function buildDots() {
        const wrap = document.getElementById("hud-dots");
        wrap.innerHTML = "";
        sections.forEach((section, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.setAttribute("aria-label", section.id);
          b.addEventListener("click", () => goTo(i));
          wrap.appendChild(b);
        });
      }

      /* ——— content render ——— */
      function updateMeta() {
        const title = t(CONTENT.meta.title, lang);
        const description = t(CONTENT.meta.description, lang);
        const ogDescription = t(CONTENT.meta.ogDescription, lang);
        document.title = title;
        document.documentElement.lang = lang;
        document.querySelector('meta[name="description"]').setAttribute("content", description);
        document.querySelector('meta[property="og:title"]').setAttribute("content", title);
        document.querySelector('meta[property="og:description"]').setAttribute("content", ogDescription);
        document.getElementById("jsonld").textContent = JSON.stringify({
          "@context": "https://schema.org",
          "@type": "Person",
          name: t(CONTENT.meta.name, lang),
          jobTitle: t(CONTENT.meta.role, lang),
          description: ogDescription,
          email: emailValue(),
          sameAs: CONTENT.contacts.links.filter((l) => l.id !== "email").map((l) => l.href)
        });
      }

      function renderChrome() {
        document.getElementById("monogram").textContent = CONTENT.meta.monogram;
        document.getElementById("brand-name").textContent = t(CONTENT.meta.brand, lang);
        document.getElementById("lang-toggle").textContent = lang === "ru" ? "EN" : "RU";
        document.getElementById("lang-toggle").title = t(CONTENT.nav.langSwitch, lang);
        document.getElementById("spiral-next-label").textContent = t((CONTENT.spiral && CONTENT.spiral.scroll) || { ru: "Дальше", en: "Next" }, lang);
        document.getElementById("hud-of").textContent = t((CONTENT.spiral && CONTENT.spiral.of) || { ru: "из", en: "of" }, lang);
        applyMode();
      }

      function renderHero() {
        document.getElementById("hero-tagline").textContent = t(CONTENT.hero.tagline || { ru: "Спека · Архитектура · Продакшен", en: "Specs · Architecture · Production" }, lang);
        document.getElementById("hero-status").textContent = t(CONTENT.meta.status, lang);
        document.getElementById("hero-name").textContent = t(CONTENT.meta.name, lang);
        document.getElementById("hero-role").textContent = t(CONTENT.meta.role, lang);
        document.getElementById("hero-sub").textContent = t(CONTENT.hero.subtitle, lang);
        document.getElementById("hero-meta").textContent = t(CONTENT.meta.location, lang);
        document.getElementById("cell-loc-label").textContent = lang === "ru" ? "Локация" : "Location";
        document.getElementById("cell-work-label").textContent = t(CONTENT.hero.workLabel || { ru: "работы", en: "work" }, lang);
        document.getElementById("cell-work-value").textContent = t(CONTENT.meta.role, lang);
        document.getElementById("cta-contact").textContent = t(CONTENT.hero.ctaContact, lang);
        document.getElementById("cta-resume").textContent = t(CONTENT.hero.ctaResume, lang);
        document.getElementById("cta-resume").href = hhLink();
      }

      function renderAbout() {
        document.querySelector('[data-section-title="about"]').textContent = t(CONTENT.about.title, lang);
        const box = document.getElementById("about-text");
        box.innerHTML = "";
        t(CONTENT.about.text, lang).forEach((p) => {
          const el = document.createElement("p"); el.textContent = p; box.appendChild(el);
        });
        const stats = document.getElementById("about-stats");
        stats.innerHTML = "";
        CONTENT.about.stats.forEach((s) => {
          const div = document.createElement("div");
          div.className = "stat";
          div.innerHTML = '<div class="stat-value"></div><div class="stat-label"></div>';
          div.querySelector(".stat-value").textContent = s.value;
          div.querySelector(".stat-label").textContent = t(s.label, lang);
          stats.appendChild(div);
        });
      }

      function makeLogoTile(logo, delayIndex) {
        const tile = document.createElement("div");
        tile.className = "logo-tile";
        if (logo.id) tile.setAttribute("data-logo", logo.id);
        tile.style.animationDelay = ((delayIndex % 6) * 0.28) + "s";
        const img = document.createElement("img");
        img.src = logo.src;
        img.alt = logo.name;
        img.loading = "eager";
        img.decoding = "async";
        img.fetchPriority = "low";
        const label = document.createElement("span");
        label.textContent = logo.name;
        tile.append(img, label);
        return tile;
      }

      function renderLogoGrid(targetId, logos) {
        const wrap = document.getElementById(targetId);
        if (!wrap) return;
        wrap.innerHTML = "";
        (logos || []).forEach((logo, i) => wrap.appendChild(makeLogoTile(logo, i)));
      }

      function renderStack() {
        document.querySelector('[data-section-title="stack"]').textContent = t(CONTENT.stack.title, lang);
        const stripLogos = (CONTENT.experience.techLogos || []).filter((l) =>
          ["python", "sqlalchemy", "postgresql", "redis", "docker", "nginx", "celery", "kubernetes", "github", "figma"].includes(l.id)
        );
        renderLogoGrid("stack-logo-strip", stripLogos);
        const wrap = document.getElementById("stack-groups");
        wrap.innerHTML = "";
        CONTENT.stack.groups.forEach((g) => {
          const block = document.createElement("div");
          block.className = "stack-group";
          const h3 = document.createElement("h3"); h3.textContent = t(g.name, lang);
          const tags = document.createElement("div"); tags.className = "tags";
          g.items.forEach((item) => {
            const span = document.createElement("span"); span.className = "tag"; span.textContent = item; tags.appendChild(span);
          });
          block.append(h3, tags); wrap.appendChild(block);
        });
      }

      function renderExperience() {
        document.querySelector('[data-section-title="experience"]').textContent = t(CONTENT.experience.title, lang);
        document.getElementById("exp-tech-title").textContent = t(CONTENT.experience.techTitle, lang);
        document.getElementById("exp-os-title").textContent = t(CONTENT.experience.osTitle, lang);
        const list = document.getElementById("experience-list");
        list.innerHTML = "";
        CONTENT.experience.items.forEach((item) => {
          const li = document.createElement("li"); li.className = "timeline-item";
          li.innerHTML = '<h3 class="exp-role"></h3><p class="exp-company"></p><p class="exp-dates"></p><ul class="exp-points"></ul>';
          li.querySelector(".exp-role").textContent = t(item.role, lang);
          li.querySelector(".exp-company").textContent = t(item.company, lang);
          li.querySelector(".exp-dates").textContent = t(item.dates, lang);
          const ul = li.querySelector(".exp-points");
          t(item.points, lang).forEach((p) => { const x = document.createElement("li"); x.textContent = p; ul.appendChild(x); });
          list.appendChild(li);
        });
        renderLogoGrid("exp-tech-logos", CONTENT.experience.techLogos);
        renderLogoGrid("exp-os-logos", CONTENT.experience.osLogos);
      }

      function renderProjects() {
        document.querySelector('[data-section-title="projects"]').textContent = t(CONTENT.projects.title, lang);
        const grid = document.getElementById("projects-grid");
        grid.innerHTML = "";
        CONTENT.projects.items.forEach((project, idx) => {
          const card = document.createElement("article");
          card.className = "project-card";
          card.dataset.detail = project.detail || "short";
          card.dataset.index = String(idx + 1).padStart(2, "0");
          const name = document.createElement("h3"); name.className = "project-name"; name.textContent = t(project.name, lang);
          const summary = document.createElement("p"); summary.className = "project-summary"; summary.textContent = t(project.summary, lang);
          const tags = document.createElement("div"); tags.className = "tags";
          project.stack.forEach((tech) => { const s = document.createElement("span"); s.className = "tag"; s.textContent = tech; tags.appendChild(s); });
          const points = document.createElement("ul"); points.className = "project-points";
          t(project.points, lang).forEach((p) => { const li = document.createElement("li"); li.textContent = p; points.appendChild(li); });
          card.append(name, summary, tags, points);
          const actions = document.createElement("div"); actions.className = "project-actions";
          if (project.code) {
            const a = document.createElement("a"); a.className = "btn btn-ghost"; a.href = project.code; a.target = "_blank"; a.rel = "noopener noreferrer";
            a.textContent = t(CONTENT.projects.codeLabel, lang); actions.appendChild(a);
          }
          if (project.demo) {
            const a = document.createElement("a"); a.className = "btn btn-primary"; a.href = project.demo; a.target = "_blank"; a.rel = "noopener noreferrer";
            a.textContent = t(CONTENT.projects.demoLabel, lang); actions.appendChild(a);
          }
          if (actions.childNodes.length) card.appendChild(actions);
          grid.appendChild(card);
        });
      }

      function renderEducation() {
        document.querySelector('[data-section-title="education"]').textContent = t(CONTENT.education.title, lang);
        const list = document.getElementById("education-list");
        list.innerHTML = "";
        CONTENT.education.items.forEach((item) => {
          const div = document.createElement("div"); div.className = "edu-item";
          div.innerHTML = '<h3 class="edu-degree"></h3><p class="edu-school"></p><p class="edu-dates"></p>';
          div.querySelector(".edu-degree").textContent = t(item.degree, lang);
          div.querySelector(".edu-school").textContent = t(item.school, lang);
          div.querySelector(".edu-dates").textContent = t(item.dates, lang);
          list.appendChild(div);
        });
      }

      function renderReviewsUi() {
        document.querySelector('[data-section-title="reviews"]').textContent = t(CONTENT.reviews.title, lang);
        document.getElementById("reviews-sub").textContent = t(CONTENT.reviews.subtitle, lang);
        document.getElementById("review-form-title").textContent = t(CONTENT.reviews.formTitle, lang);
        document.getElementById("label-review-name").textContent = t(CONTENT.reviews.name, lang);
        document.getElementById("label-review-rating").textContent = t(CONTENT.reviews.rating, lang);
        document.getElementById("label-review-text").textContent = t(CONTENT.reviews.text, lang);
        document.getElementById("review-submit").textContent = t(CONTENT.reviews.submit, lang);
      }

      function renderApplyUi() {
        document.querySelector('[data-section-title="apply"]').textContent = t(CONTENT.apply.title, lang);
        document.getElementById("apply-sub").textContent = t(CONTENT.apply.subtitle, lang);
        document.getElementById("label-apply-name").textContent = t(CONTENT.apply.name, lang);
        document.getElementById("label-apply-contact").textContent = t(CONTENT.apply.contact, lang);
        document.getElementById("label-apply-kind").textContent = t(CONTENT.apply.kind, lang);
        document.getElementById("label-apply-message").textContent = t(CONTENT.apply.message, lang);
        document.getElementById("opt-kind-job").textContent = t(CONTENT.apply.kindJob, lang);
        document.getElementById("opt-kind-order").textContent = t(CONTENT.apply.kindOrder, lang);
        document.getElementById("apply-submit").textContent = t(CONTENT.apply.submit, lang);
      }

      function renderContacts() {
        document.querySelector('[data-section-title="contacts"]').textContent = t(CONTENT.contacts.title, lang);
        document.getElementById("contacts-sub").textContent = t(CONTENT.contacts.subtitle, lang);
        const grid = document.getElementById("contacts-grid");
        grid.innerHTML = "";
        CONTENT.contacts.links.forEach((link) => {
          const a = document.createElement("a");
          a.className = "contact-card"; a.href = link.href;
          if (!link.href.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
          a.innerHTML = '<span class="contact-label"></span><span class="contact-value"></span>';
          if (link.id === "github") {
            const img = document.createElement("img");
            img.className = "contact-logo";
            img.src = "assets/github.png";
            img.alt = "GitHub";
            a.insertBefore(img, a.firstChild);
          }
          a.querySelector(".contact-label").textContent = link.label;
          a.querySelector(".contact-value").textContent = link.value;
          grid.appendChild(a);
        });
        document.getElementById("copy-email").textContent = t(CONTENT.contacts.copy, lang);
        const year = new Date().getFullYear();
        document.getElementById("footer-copy").textContent = "© " + year + " " + t(CONTENT.meta.name, lang) + " · " + t(CONTENT.footer.rights, lang);
      }

      function showToast(message, ok) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.toggle("is-ok", !!ok);
        toast.classList.toggle("is-err", !ok);
        toast.classList.add("is-show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove("is-show"), 3000);
      }
      function setStatus(el, message, ok) {
        el.textContent = message || "";
        el.classList.toggle("is-ok", !!ok && !!message);
        el.classList.toggle("is-err", !ok && !!message);
      }
      function stars(n) {
        n = Math.max(1, Math.min(5, Number(n) || 0));
        return "★".repeat(n) + "☆".repeat(5 - n);
      }
      function renderReviewsList(items) {
        const list = document.getElementById("reviews-list");
        list.innerHTML = "";
        if (!items || !items.length) {
          const p = document.createElement("p"); p.className = "reviews-empty";
          p.textContent = t(CONTENT.reviews.empty, lang); list.appendChild(p); return;
        }
        items.forEach((item) => {
          const card = document.createElement("article"); card.className = "review-card";
          card.innerHTML = '<div class="review-head"><h3 class="review-name"></h3><span class="review-rating"></span></div><p class="review-text"></p>';
          card.querySelector(".review-name").textContent = item.name;
          card.querySelector(".review-rating").textContent = stars(item.rating);
          card.querySelector(".review-text").textContent = item.text;
          list.appendChild(card);
        });
      }
      async function loadReviews() {
        const list = document.getElementById("reviews-list");
        try {
          const res = await fetch(apiUrl("/api/reviews"));
          if (!res.ok) throw new Error("x");
          renderReviewsList(await res.json());
        } catch (_) {
          list.innerHTML = "";
          const p = document.createElement("p"); p.className = "reviews-error";
          p.textContent = t(CONTENT.reviews.loadError, lang); list.appendChild(p);
        }
      }

      function renderAll() {
        applyTheme();
        updateMeta();
        renderChrome();
        renderHero();
        renderAbout();
        renderStack();
        renderExperience();
        renderProjects();
        renderEducation();
        renderReviewsUi();
        renderApplyUi();
        renderContacts();
        loadReviews();
      }

      /* events */
      document.getElementById("lang-toggle").addEventListener("click", () => {
        lang = lang === "ru" ? "en" : "ru";
        safeSet(STORAGE_LANG, lang);
        renderAll();
      });
      document.getElementById("theme-toggle").addEventListener("click", () => {
        theme = theme === "dark" ? "light" : "dark";
        safeSet(STORAGE_THEME, theme);
        applyTheme();
      });
      document.getElementById("mode-toggle").addEventListener("click", () => {
        accessible = !accessible;
        safeSet(STORAGE_MODE, accessible ? "accessible" : "spiral");
        applyMode();
        if (!accessible) goTo(currentSection);
      });
      document.getElementById("spiral-next").addEventListener("click", () => goTo(targetSection + 1));
      document.getElementById("brand-link").addEventListener("click", (e) => {
        e.preventDefault(); goTo(0);
      });
      document.getElementById("cta-contact").addEventListener("click", (e) => {
        e.preventDefault();
        const idx = sections.findIndex((s) => s.id === "apply");
        goTo(idx < 0 ? sectionCount - 2 : idx);
      });

      sections.forEach((section, i) => {
        section.addEventListener("click", (e) => {
          if (accessible) return;
          if (i === currentSection) return;
          if (e.target.closest("a,button,input,textarea,select,label,form")) return;
          goTo(i);
        });
      });

      document.addEventListener("wheel", onWheel, { passive: false });
      window.addEventListener("keydown", onKey);
      window.addEventListener("resize", () => {
        winW = window.innerWidth;
        winH = window.innerHeight;
        buildSpiral();
        paintSpiralTransform();
        if (!spinning) {
          scrollHandler();
          pinBrand();
        }
      });

      window.addEventListener("touchstart", (e) => {
        if (accessible) return;
        const touch = e.touches[0];
        moved = 0; prevMoved = 0;
        touchStartX = touch.pageX; touchStartY = touch.pageY;
      }, { passive: true });

      window.addEventListener("touchmove", (e) => {
        if (accessible) return;
        const touch = e.touches[0];
        const dx = touchStartX - touch.pageX;
        const dy = touchStartY - touch.pageY;
        prevMoved = moved;
        moved += dy + dx * 0.35;
        touchStartX = touch.pageX; touchStartY = touch.pageY;
      }, { passive: true });

      window.addEventListener("touchend", () => {
        if (accessible) return;
        if (moved > 48) goTo(targetSection + 1);
        else if (moved < -48) goTo(targetSection - 1);
        moved = 0; prevMoved = 0;
      });

      document.getElementById("copy-email").addEventListener("click", async () => {
        const value = emailValue();
        try { await navigator.clipboard.writeText(value); }
        catch (_) {
          const ta = document.createElement("textarea"); ta.value = value;
          document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
        }
        const btn = document.getElementById("copy-email");
        const prev = btn.textContent;
        btn.textContent = t(CONTENT.contacts.copied, lang);
        setTimeout(() => { btn.textContent = prev; }, 1500);
      });

      document.getElementById("apply-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const statusEl = document.getElementById("apply-status");
        const btn = document.getElementById("apply-submit");
        btn.disabled = true;
        try {
          const res = await fetch(apiUrl("/api/applications"), {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: form.name.value.trim(), contact: form.contact.value.trim(),
              kind: form.kind.value, message: form.message.value.trim()
            })
          });
          if (!res.ok) throw new Error("x");
          form.reset();
          const msg = t(CONTENT.apply.success, lang);
          setStatus(statusEl, msg, true); showToast(msg, true);
        } catch (_) {
          const msg = t(CONTENT.apply.error, lang);
          setStatus(statusEl, msg, false); showToast(msg, false);
        } finally { btn.disabled = false; }
      });

      document.getElementById("review-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.currentTarget;
        const statusEl = document.getElementById("review-status");
        const btn = document.getElementById("review-submit");
        btn.disabled = true;
        try {
          const res = await fetch(apiUrl("/api/reviews"), {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: form.name.value.trim(), text: form.text.value.trim(), rating: Number(form.rating.value)
            })
          });
          if (!res.ok) throw new Error("x");
          form.reset(); form.rating.value = "5";
          const msg = t(CONTENT.reviews.success, lang);
          setStatus(statusEl, msg, true); showToast(msg, true);
        } catch (_) {
          const msg = t(CONTENT.reviews.error, lang);
          setStatus(statusEl, msg, false); showToast(msg, false);
        } finally { btn.disabled = false; }
      });

      buildDots();
      renderAll();
      if (!accessible) {
        pinBrand();
        buildSpiral();
        // paint every panel once so the first flips don't "materialize" late
        sections.forEach((s) => s.classList.remove("is-far"));
        applySectionColors(0, true);
        paintSpiralTransform();
        markActiveSection(0);
        updateHudOnly(0);
        requestAnimationFrame(() => {
          void spiralEl.offsetWidth;
          applyFarSections();
        });
      }
    })();
  </script>
</body>
</html>
